<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colyseus Latency Test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1115; color: #e6e6e6; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  canvas { background: #171a21; border: 1px solid #2a2f3a; border-radius: 8px; touch-action: none;
           width: min(100%, 600px); aspect-ratio: 1; }
  #panel { min-width: 240px; flex: 1; }
  table { border-collapse: collapse; width: 100%; max-width: 320px; }
  td { padding: 4px 8px; border-bottom: 1px solid #222733; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  button { background: #2a2f3a; color: inherit; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-top: 12px; }
  #dpad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; grid-template-columns: repeat(3, 64px);
          grid-auto-rows: 64px; gap: 6px; margin-top: 16px; }
  #dpad button { margin: 0; font-size: 22px; user-select: none; -webkit-user-select: none; touch-action: none; }
  #status.ok { color: #6fdc8c; } #status.bad { color: #ff6b6b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="600" height="600"></canvas>
  <div id="panel">
    <h3 style="margin-top:0">Latency</h3>
    <table>
      <tr><td>Status</td><td id="status">connecting…</td></tr>
      <tr><td>RTT last</td><td id="last">–</td></tr>
      <tr><td>RTT avg</td><td id="avg">–</td></tr>
      <tr><td>RTT min / max</td><td id="minmax">–</td></tr>
      <tr><td>RTT p95</td><td id="p95">–</td></tr>
      <tr><td>Jitter</td><td id="jitter">–</td></tr>
      <tr><td>Pings lost</td><td id="lost">0</td></tr>
      <tr><td>State patches/s</td><td id="pps">0</td></tr>
      <tr><td>Players</td><td id="players">0</td></tr>
      <tr><td>Connect time</td><td id="conn">–</td></tr>
    </table>
    <button id="bot">Auto-move bot: off</button>
    <div id="dpad">
      <button data-dir="up" style="grid-area:u">▲</button>
      <button data-dir="left" style="grid-area:l">◀</button>
      <button data-dir="right" style="grid-area:r">▶</button>
      <button data-dir="down" style="grid-area:d">▼</button>
    </div>
    <p style="color:#8a90a0">Move with WASD / arrow keys or the on-screen pad. Open in several tabs or devices to see each other's dots.</p>
  </div>
</div>
<script src="https://unpkg.com/colyseus.js@0.16.22/dist/colyseus.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
const WORLD = 1000, SEND_MS = 33, PING_MS = 1000, WINDOW = 60;

let room = null, myId = null, botOn = false;
let rtts = [], lost = 0, pendingPings = new Map(), patches = 0;
const target = { x: WORLD / 2, y: WORLD / 2 };

const pct = (arr, p) => { const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
const fmt = v => v == null ? "–" : v.toFixed(1) + " ms";

function setStatus(text, ok) { const s = $("status"); s.textContent = text; s.className = ok ? "ok" : "bad"; }

async function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const client = new Colyseus.Client(`${proto}://${location.host}`);
  const t0 = performance.now();
  try {
    room = await client.joinOrCreate("game");
  } catch (e) {
    setStatus("failed: " + (e.message || e), false);
    setTimeout(connect, 3000);
    return;
  }
  $("conn").textContent = fmt(performance.now() - t0);
  myId = room.sessionId;
  setStatus("connected", true);

  room.onMessage("pong", t => {
    if (!pendingPings.has(t)) return;
    pendingPings.delete(t);
    rtts.push(performance.now() - t);
    if (rtts.length > WINDOW) rtts.shift();
  });
  room.onStateChange(() => { patches++; });
  room.onLeave(() => { setStatus("disconnected – retrying", false); room = null; setTimeout(connect, 2000); });
  room.onError((c, m) => setStatus("error " + c + " " + m, false));
}

setInterval(() => {
  if (!room) return;
  const t = performance.now();
  pendingPings.set(t, true);
  for (const k of pendingPings.keys()) if (t - k > 5000) { pendingPings.delete(k); lost++; }
  room.send("ping", t);
}, PING_MS);

setInterval(() => {
  if (!room) return;
  room.send("move", { x: target.x, y: target.y });
}, SEND_MS);

setInterval(() => {
  $("pps").textContent = patches; patches = 0;
  $("lost").textContent = lost;
  if (rtts.length) {
    const avg = rtts.reduce((a, b) => a + b, 0) / rtts.length;
    const jit = rtts.length > 1 ? rtts.slice(1).reduce((a, v, i) => a + Math.abs(v - rtts[i]), 0) / (rtts.length - 1) : 0;
    $("last").textContent = fmt(rtts[rtts.length - 1]);
    $("avg").textContent = fmt(avg);
    $("minmax").textContent = `${Math.min(...rtts).toFixed(1)} / ${Math.max(...rtts).toFixed(1)}`;
    $("p95").textContent = fmt(pct(rtts, 0.95));
    $("jitter").textContent = fmt(jit);
  }
}, 1000);

// movement: WASD / arrow keys and the on-screen D-pad both feed `held`
const SPEED = 400; // world units per second
const held = { up: false, down: false, left: false, right: false };
const KEYS = { w: "up", arrowup: "up", s: "down", arrowdown: "down", a: "left", arrowleft: "left", d: "right", arrowright: "right" };
window.addEventListener("keydown", e => { const d = KEYS[e.key.toLowerCase()]; if (d) { held[d] = true; e.preventDefault(); } });
window.addEventListener("keyup", e => { const d = KEYS[e.key.toLowerCase()]; if (d) held[d] = false; });
window.addEventListener("blur", () => { for (const d in held) held[d] = false; });
document.querySelectorAll("[data-dir]").forEach(btn => {
  const d = btn.dataset.dir;
  const on = e => { held[d] = true; e.preventDefault(); };
  const off = e => { held[d] = false; e.preventDefault(); };
  btn.addEventListener("pointerdown", on);
  btn.addEventListener("pointerup", off);
  btn.addEventListener("pointerleave", off);
  btn.addEventListener("pointercancel", off);
});
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (botOn) {
    const a = now / 1000;
    target.x = WORLD / 2 + Math.cos(a) * 300;
    target.y = WORLD / 2 + Math.sin(a) * 300;
    return;
  }
  target.x = Math.max(0, Math.min(WORLD, target.x + ((held.right ? 1 : 0) - (held.left ? 1 : 0)) * SPEED * dt));
  target.y = Math.max(0, Math.min(WORLD, target.y + ((held.down ? 1 : 0) - (held.up ? 1 : 0)) * SPEED * dt));
}, 16);
$("bot").onclick = () => { botOn = !botOn; $("bot").textContent = "Auto-move bot: " + (botOn ? "on" : "off"); };

// Smooth rendering: your own dot is drawn from local input (no network wait);
// other players ease toward their latest server position every frame.
const shown = new Map();
const SMOOTH = 14; // higher = snappier, lower = smoother
let lastFrame = performance.now();
function draw(now = performance.now()) {
  requestAnimationFrame(draw);
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  const ease = 1 - Math.exp(-SMOOTH * dt);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const k = canvas.width / WORLD;
  let n = 0;
  const seen = new Set();
  if (room && room.state && room.state.players) room.state.players.forEach((p, id) => {
    n++; seen.add(id);
    const me = id === myId;
    let s = shown.get(id);
    if (!s) { s = { x: p.x, y: p.y }; shown.set(id, s); }
    if (me) { s.x = target.x; s.y = target.y; }
    else { s.x += (p.x - s.x) * ease; s.y += (p.y - s.y) * ease; }
    ctx.beginPath();
    ctx.arc(s.x * k, s.y * k, me ? 10 : 8, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.fill();
    if (me) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = "#c9ced9"; ctx.font = "12px system-ui";
    ctx.fillText(p.name + (me ? " (you)" : ""), s.x * k + 12, s.y * k + 4);
  });
  for (const id of shown.keys()) if (!seen.has(id)) shown.delete(id);
  $("players").textContent = n;
}
draw();
connect();
</script>
</body>
</html>
